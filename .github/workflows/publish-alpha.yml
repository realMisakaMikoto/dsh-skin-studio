name: Publish desktop

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable release tag to publish to npm
        required: true
        default: '0.7.0'
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-desktop-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          path: release-source
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - name: Validate immutable release source
        working-directory: release-source
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          test "$RELEASE_TAG" = "$version"
          git tag --points-at HEAD | grep -Fx -- "$RELEASE_TAG"
      - run: npm ci
        working-directory: release-source
      - run: npm run verify
        working-directory: release-source
      - run: npm run verify:client
        working-directory: release-source
      - name: Prepare public package from verified release
        run: npm run release:pack -- --source release-source --output artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: npm-${{ inputs.tag }}
          path: artifacts/dsh-skin-studio-${{ inputs.tag }}.tgz
          if-no-files-found: error
      - name: Publish stable package through npm trusted publishing
        shell: bash
        run: |
          if npm view "dsh-skin-studio@$RELEASE_TAG" version --prefer-online >/dev/null 2>&1; then
            echo "Version already published; preserving the immutable npm artifact."
          else
            npm publish "./artifacts/dsh-skin-studio-${RELEASE_TAG}.tgz" --tag latest --provenance --access public
          fi
      - name: Verify registry version
        shell: bash
        run: |
          for attempt in {1..30}; do
            if test "$(npm view "dsh-skin-studio@$RELEASE_TAG" version --prefer-online 2>/dev/null)" = "$RELEASE_TAG"; then
              npm view "dsh-skin-studio@$RELEASE_TAG" version dist.integrity dist.attestations --json --prefer-online
              exit 0
            fi
            echo "Waiting for npm package processing ($attempt/30)."
            sleep 10
          done
          echo "Registry processing did not finish within five minutes." >&2
          exit 1
